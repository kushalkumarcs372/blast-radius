services:
  - type: web
    name: blast-radius
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        sync: false
      - key: FALKORDB_USERNAME
        sync: false
      - key: FALKORDB_PASSWORD
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ASK_LIMIT_PER_HOUR
        value: "30"
