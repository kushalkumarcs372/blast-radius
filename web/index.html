<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blast Radius</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<style>
  :root {
    --bg: #0d1013; --panel: #14181d; --panel-2: #1a1f25; --line: #262d35; --text: #e6e9ec;
    --muted: #8b949e; --faint: #5b636c; --accent: #ff5a36; --warn: #f2a33a; --ok: #3fb68b;
    --info: #6ba4ff; --edge: #3a434d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.5 "IBM Plex Sans", system-ui, sans-serif; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  header { height: 52px; display: flex; align-items: center; gap: 16px; padding: 0 16px;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  header h1 span { color: var(--accent); }
  header .sub { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  select, button, input { font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: wait; }
  a { color: var(--info); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 440px; height: calc(100% - 52px); }
  #graph-wrap { position: relative; border-right: 1px solid var(--line); }
  #cy { position: absolute; inset: 0; }
  .legend { position: absolute; left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 12px;
    background: rgba(20,24,29,.9); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
    font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px;
    vertical-align: -1px; }
  .hint { position: absolute; left: 12px; top: 12px; font-size: 12px; color: var(--muted);
    background: rgba(20,24,29,.9); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  aside { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  section h2 { margin: 0 0 8px; font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .08em; color: var(--muted); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .alert { display: flex; align-items: center; gap: 10px; }
  .alert .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 4px rgba(255,90,54,.18); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(255,90,54,0); } }
  .alert .body { flex: 1; min-width: 0; }
  .alert .title { font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; }
  .empty { color: var(--faint); font-size: 13px; }
  .agent { position: relative; padding-left: 18px; }
  .agent + .agent { margin-top: 10px; }
  .agent::before { content: ""; position: absolute; left: 4px; top: 6px; bottom: -16px; width: 1px;
    background: var(--line); }
  .agent:last-child::before { display: none; }
  .agent::after { content: ""; position: absolute; left: 0; top: 4px; width: 9px; height: 9px; border-radius: 50%;
    background: var(--panel); border: 2px solid var(--info); }
  .agent .name { font-weight: 600; text-transform: capitalize; }
  .agent .name small { font-weight: 400; color: var(--muted); margin-left: 6px; text-transform: none; }
  .agent p { margin: 4px 0 0; }
  .cite { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--warn);
    background: rgba(242,163,58,.1); border-radius: 4px; padding: 0 4px; }
  details { margin-top: 6px; }
  summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  pre { white-space: pre-wrap; word-break: break-word; font: 12px/1.45 "IBM Plex Mono", monospace;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin: 6px 0 0;
    color: #b8c0c8; }
  ol.actions { margin: 0; padding-left: 20px; }
  ol.actions li + li { margin-top: 6px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .stat b { display: block; font-size: 20px; font-weight: 600; }
  .stat span { color: var(--muted); font-size: 12px; }
  .stat.hot b { color: var(--accent); }
  .ask-row { display: flex; gap: 8px; }
  .ask-row input { flex: 1; min-width: 0; }
  .answer { margin-top: 10px; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font: 12px "IBM Plex Mono", monospace; border: 1px solid var(--line); border-radius: 999px;
    padding: 1px 8px; color: var(--muted); }
  .warn { color: var(--warn); font-size: 12px; margin-top: 6px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .status { position: fixed; right: 16px; bottom: 16px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; font-size: 13px; display: none; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
    #graph-wrap { height: 55vh; border-right: 0; border-bottom: 1px solid var(--line); }
    header .sub { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Blast<span>Radius</span></h1>
  <div class="sub">on-call agents on a FalkorDB knowledge graph</div>
  <div class="spacer"></div>
  <label class="meta" for="tenant">Company</label>
  <select id="tenant"></select>
  <button id="reset" title="Reload synthetic data so the demo alert fires again">Reset demo</button>
</header>
<main>
  <div id="graph-wrap">
    <div id="cy" role="img" aria-label="Service dependency graph"></div>
    <div class="hint" id="hint">Click a service to see what breaks if it goes down</div>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>alerting</span>
      <span><i style="background:var(--warn)"></i>at risk</span>
      <span><i style="background:var(--info)"></i>suspect deploy</span>
      <span><i style="background:#56606b"></i>service (size = PageRank)</span>
    </div>
  </div>
  <aside>
    <section>
      <h2>Open alerts</h2>
      <div id="alerts" class="card"><div class="empty">Loading…</div></div>
    </section>
    <section id="incident-sec" hidden>
      <h2>Incident <span id="inc-id" class="mono"></span></h2>
      <div class="stats" id="stats"></div>
      <div class="card" style="margin-top:8px" id="timeline"></div>
    </section>
    <section id="actions-sec" hidden>
      <h2>Proposed actions</h2>
      <div class="card"><ol class="actions" id="actions"></ol></div>
    </section>
    <section>
      <h2>Ask the graph</h2>
      <div class="card">
        <div class="ask-row">
          <input id="q" placeholder="Who fixed this last time?" maxlength="500">
          <button id="ask">Ask</button>
        </div>
        <div class="row" style="margin-top:8px" id="suggest"></div>
        <div id="answer" class="answer"></div>
      </div>
    </section>
    <section>
      <h2>Past sessions</h2>
      <div id="incidents" class="card"><div class="empty">No open incidents.</div></div>
    </section>
  </aside>
</main>
<div class="status" id="status"></div>
<script>
const $ = (id) => document.getElementById(id);
const state = { tenant: "acme", incident: null, session: "web-" + Math.random().toString(36).slice(2, 8) };
let cy;

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}
function status(msg) { const s = $("status"); s.textContent = msg || ""; s.style.display = msg ? "block" : "none"; }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function cites(text) { return esc(text).replace(/\[([a-z0-9][a-z0-9-]+)\]/g, '<span class="cite">$1</span>'); }
function ago(ts) { const m = Math.round((Date.now() - ts) / 60000); return m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago`; }

// ---------- graph ----------
async function loadGraph() {
  const g = await api(`/api/graph?tenant=${state.tenant}`);
  await document.fonts.ready;  // draw only after the label font loads, or labels get clipped
  const maxPr = Math.max(...g.nodes.map((n) => n.pagerank), 0.01);
  const elements = [
    ...g.nodes.map((n) => ({ data: { id: n.id, label: n.id, tier: n.tier, team: n.team, size: 22 + 34 * (n.pagerank / maxPr) } })),
    ...g.edges.map((e) => ({ data: { id: `${e.source}->${e.target}`, source: e.source, target: e.target } })),
  ];
  if (cy) cy.destroy();
  cy = cytoscape({
    container: $("cy"), elements, wheelSensitivity: 0.2,
    style: [
      { selector: "node", style: {
        "background-color": "#56606b", width: "data(size)", height: "data(size)", label: "data(label)",
        color: "#c9d1d9", "font-family": "IBM Plex Mono, monospace", "font-size": 11, "text-valign": "bottom", "text-margin-y": 4,
        "text-background-color": "#0d1013", "text-background-opacity": 0.7, "text-background-padding": 2,
        "border-width": 0 } },
      { selector: "node[tier = 'edge']", style: { shape: "round-rectangle" } },
      { selector: "node[tier = 'data']", style: { shape: "barrel" } },
      { selector: "node[tier = 'external']", style: { shape: "diamond" } },
      { selector: "edge", style: { width: 1, "line-color": "#3a434d", "target-arrow-color": "#3a434d",
        "target-arrow-shape": "triangle", "arrow-scale": 0.7, "curve-style": "bezier", opacity: 0.6 } },
      { selector: ".dim", style: { opacity: 0.18 } },
      { selector: ".risk", style: { "background-color": "#f2a33a", opacity: 1 } },
      { selector: ".alerting", style: { "background-color": "#ff5a36", "border-width": 4,
        "border-color": "rgba(255,90,54,.35)", opacity: 1 } },
      { selector: ".suspect", style: { "border-width": 4, "border-color": "#6ba4ff", "border-style": "double", opacity: 1 } },
      { selector: "edge.path", style: { width: 2.5, "line-color": "#f2a33a", "target-arrow-color": "#f2a33a", opacity: 1 } },
      { selector: "edge.cause", style: { width: 3, "line-color": "#6ba4ff", "target-arrow-color": "#6ba4ff",
        "line-style": "dashed", opacity: 1 } },
    ],
    layout: { name: "breadthfirst", directed: true, spacingFactor: 1.15, padding: 40,
      roots: g.nodes.filter((n) => n.tier === "edge").map((n) => "#" + n.id).join(",") },
  });
  cy.on("tap", "node", (evt) => previewBlast(evt.target.id()));
  cy.on("tap", (evt) => { if (evt.target === cy) clearHighlight(); });
}

function clearHighlight() {
  if (!cy) return;
  cy.elements().removeClass("dim risk alerting suspect path cause");
}
function edgeBetween(a, b) {
  return cy.getElementById(`${a}->${b}`).length ? cy.getElementById(`${a}->${b}`) : cy.getElementById(`${b}->${a}`);
}
function highlight({ alerting, atRisk = [], suspects = [] }) {
  clearHighlight();
  cy.elements().addClass("dim");
  const on = (el) => el.removeClass("dim");
  atRisk.forEach((r) => {
    on(cy.getElementById(r.service).addClass("risk"));
    for (let i = 0; i < r.path.length - 1; i++) on(edgeBetween(r.path[i], r.path[i + 1]).addClass("path"));
  });
  suspects.forEach((s) => {
    on(cy.getElementById(s.service).addClass("suspect"));
    for (let i = 0; i < s.path.length - 1; i++) on(edgeBetween(s.path[i], s.path[i + 1]).removeClass("path").addClass("cause"));
  });
  on(cy.getElementById(alerting).addClass("alerting"));
}
async function previewBlast(service) {
  const r = await api(`/api/tools/blast_radius?tenant=${state.tenant}&service=${encodeURIComponent(service)}`);
  highlight({ alerting: service, atRisk: r.results.map((x, i) => ({ ...x, path: r.evidence[i] })) });
  $("hint").innerHTML = `<b>${esc(service)}</b> down → ${r.results.length} services at risk · <span class="mono">blast_radius</span>`;
}

// ---------- alerts & incidents ----------
async function loadAlerts() {
  const alerts = await api(`/api/alerts?tenant=${state.tenant}`);
  $("alerts").innerHTML = alerts.length ? alerts.map((a) => `
    <div class="alert">
      <div class="dot"></div>
      <div class="body"><div class="title">${esc(a.signal)}</div>
        <div class="meta"><span class="mono">${esc(a.service)}</span> · ${esc(a.severity)} · ${ago(a.ts)}</div></div>
      <button class="primary" data-alert="${esc(a.alert)}">Run agents</button>
    </div>`).join("") : `<div class="row" style="justify-content:space-between">
      <div class="empty">No open alerts. The agents already handled the demo alert; open it under Past sessions, or fire it again.</div>
      <button class="primary" id="refire">Fire demo alert</button></div>`;
  $("alerts").querySelectorAll("button[data-alert]").forEach((b) => b.onclick = () => respond(b.dataset.alert, b));
  if ($("refire")) $("refire").onclick = () => $("reset").click();
}
async function loadIncidents() {
  const list = await api(`/api/incidents?tenant=${state.tenant}`);
  $("incidents").innerHTML = list.length ? list.map((i) => `
    <div class="row" style="justify-content:space-between">
      <div><div>${esc(i.title)}</div><div class="meta">${esc(i.status)} · ${i.episodes} episodes in graph memory</div></div>
      <button data-inc="${esc(i.incident)}">Open</button>
    </div>`).join("") : `<div class="empty">No open incidents.</div>`;
  $("incidents").querySelectorAll("button").forEach((b) => b.onclick = () => showIncident(b.dataset.inc));
}
async function respond(alert, btn) {
  btn.disabled = true; status("Triage → Investigator → Responder running…");
  try {
    const out = await api("/api/respond", { method: "POST", body: JSON.stringify({ alert, tenant: state.tenant }) });
    status(`Done in ${(out.total_ms / 1000).toFixed(1)} s`);
    await showIncident(out.incident, out.steps);
    await loadAlerts(); await loadIncidents();
  } catch (e) { status("Error: " + e.message); btn.disabled = false; }
  setTimeout(() => status(""), 2500);
}
async function showIncident(id, steps) {
  const m = await api(`/api/incidents/${id}?tenant=${state.tenant}`);
  state.incident = id;
  const tri = m.triage || {}, inv = m.investigator || {}, resp = m.responder || {};
  $("incident-sec").hidden = false; $("actions-sec").hidden = false;
  $("inc-id").textContent = id;
  const cause = inv.likely_cause;
  $("stats").innerHTML = `
    <div class="stat hot"><b>${(tri.at_risk || []).length}</b><span>services at risk</span></div>
    <div class="stat"><b>${(tri.customer_facing_at_risk || []).length}</b><span>customer-facing</span></div>
    <div class="stat"><b>${cause ? Math.round(cause.confidence * 100) + "%" : "–"}</b><span>cause confidence</span></div>`;
  const ms = Object.fromEntries((steps || []).map((s) => [s.agent, s]));
  $("timeline").innerHTML = m.episodes.filter((e) => e.agent !== "assistant").map((e) => {
    const s = ms[e.agent];
    return `<div class="agent">
      <div class="name">${esc(e.agent)}<small>${s ? s.ms + " ms · " + esc(s.summary_source) : esc(e.session)}${e.handed_off_to ? " → " + esc(e.handed_off_to) : ""}</small></div>
      <p>${cites(e.summary)}</p>
      <details><summary>graph evidence (${e.cites.length} nodes)${s ? " · Cypher" : ""}</summary>
        <pre>${esc(e.cites.join("\n"))}</pre>${s ? `<pre>${esc(s.cypher.join("\n\n"))}</pre>` : ""}</details>
    </div>`;
  }).join("");
  $("actions").innerHTML = (resp.actions || []).map((a) => `<li>${cites(a)}</li>`).join("");
  highlight({ alerting: tri.service, atRisk: tri.at_risk || [], suspects: tri.suspects || [] });
  $("hint").innerHTML = `Orange: impact paths from <b>${esc(tri.service)}</b> · blue dashed: link to the suspect deploy`;
  renderSuggestions();
}

// ---------- ask ----------
function renderSuggestions() {
  const qs = state.incident
    ? ["What caused this and who fixed it last time?", "Why does payments have its own database?", "What else depends on payments?"]
    : ["Which services are most critical?", "Who owns checkout and who is on call?", "How is mobile-bff connected to token-store?"];
  $("suggest").innerHTML = qs.map((q) => `<button class="chip" style="cursor:pointer">${esc(q)}</button>`).join("");
  $("suggest").querySelectorAll("button").forEach((b) => b.onclick = () => { $("q").value = b.textContent; ask(); });
}
async function ask() {
  const question = $("q").value.trim(); if (!question) return;
  $("ask").disabled = true; $("answer").innerHTML = `<div class="meta">Thinking — choosing graph tools…</div>`;
  try {
    const out = await api("/api/ask", { method: "POST", body: JSON.stringify({
      question, tenant: state.tenant, session: state.session, incident: state.incident }) });
    $("answer").innerHTML = `<div>${cites(out.answer)}</div>
      <div class="tools">${out.tools.map((t) => `<span class="chip">${esc(t.tool)}(${esc(Object.values(t.args).join(", "))})</span>`).join("")}</div>
      ${out.invented_ids.length ? `<div class="warn">Flagged: ${esc(out.invented_ids.join(", "))} not found in the graph</div>` : ""}
      <div class="meta" style="margin-top:6px">${esc(out.provider || "")} · saved to graph memory (session ${esc(state.session)})</div>`;
  } catch (e) { $("answer").innerHTML = `<div class="warn">${esc(e.message)}</div>`; }
  $("ask").disabled = false;
}

// ---------- boot ----------
async function switchTenant(t) {
  state.tenant = t; state.incident = null;
  $("incident-sec").hidden = true; $("actions-sec").hidden = true; $("answer").innerHTML = "";
  await loadGraph(); await loadAlerts(); await loadIncidents(); renderSuggestions();
  // A visitor arriving after the alert was handled sees the latest incident instead of an empty map.
  const [alerts, incidents] = await Promise.all([api(`/api/alerts?tenant=${t}`), api(`/api/incidents?tenant=${t}`)]);
  if (!alerts.length && incidents.length) await showIncident(incidents[0].incident);
}
$("tenant").onchange = (e) => switchTenant(e.target.value);
$("ask").onclick = ask;
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });
$("reset").onclick = async () => {
  $("reset").disabled = true; status("Reloading synthetic companies…");
  try { await api("/api/reset", { method: "POST" }); await switchTenant(state.tenant); status("Demo reset"); }
  catch (e) { status("Error: " + e.message); }
  $("reset").disabled = false; setTimeout(() => status(""), 2000);
};
(async () => {
  try {
    const tenants = await api("/api/tenants");
    $("tenant").innerHTML = tenants.map((t) => `<option ${t === "acme" ? "selected" : ""}>${esc(t)}</option>`).join("");
    await switchTenant(tenants.includes("acme") ? "acme" : tenants[0]);
  } catch (e) { status("Cannot reach the API: " + e.message); }
})();
</script>
</body>
</html>
